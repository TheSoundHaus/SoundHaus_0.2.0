[package]
name = "als-parser"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.5.1", default-features = false, features = ["serde-json", "napi6", "async"] }
napi-derive = "3.5.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.31"
flate2 = "1.0"
strsim = "0.11"

[build-dependencies]
napi-build = "2.0.1"
