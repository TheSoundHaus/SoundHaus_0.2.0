# ================================================================
# Deploy — Environment promotion pipeline
# ================================================================
#
# Environments:
#   dev         — feature branches (no deploy, CI only via ci.yml)
#   staging     — auto-deploy on push to integration
#   production  — auto-deploy on push to main (requires PR approval)
#
# Flow:
#   feature branch → PR → integration (staging auto-deploy)
#   integration → PR (approved) → main (production auto-deploy)
#
# Required GitHub Secrets:
#   DO_SSH_KEY         — Private SSH key for droplet access
#   DO_HOST            — Droplet IP address
#   DO_USERNAME        — SSH username (usually "root")
#
# Required GitHub Environments (Settings → Environments):
#   staging     — no protection rules (auto-deploy)
#   production  — recommended: add required reviewers
#
# Server prerequisites:
#   /opt/soundhaus-staging/   — staging directory with .env.compose.staging
#   /opt/soundhaus/           — production directory with .env.compose.production
# ================================================================

name: Deploy

on:
  push:
    branches: [integration, main]

jobs:
  # ── Deploy Staging (integration branch only) ──────────────────
  deploy-staging:
    name: Deploy → Staging
    if: github.ref == 'refs/heads/integration'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code to staging
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='apps/desktop' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.remote' \
            ./ ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }}:/opt/soundhaus-staging/

      - name: Build and restart staging containers
        run: |
          ssh ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} << 'ENDSSH'
            cd /opt/soundhaus-staging
            docker compose --env-file .env.compose.staging build --no-cache fastapi
            docker compose --env-file .env.compose.staging up -d
            echo "Waiting for services…"
            sleep 10
            curl -sf http://localhost:8001/health || echo "WARNING: Staging health check failed"
          ENDSSH

      - name: Verify staging
        run: |
          sleep 5
          curl -sf http://${{ secrets.DO_HOST }}:8001/health || exit 1
          echo "Staging deploy successful"

  # ── Deploy Production (main branch only) ──────────────────────
  deploy-production:
    name: Deploy → Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code to production
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='apps/desktop' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.remote' \
            ./ ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }}:/opt/soundhaus/

      - name: Build and restart production containers
        run: |
          ssh ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} << 'ENDSSH'
            cd /opt/soundhaus
            docker compose --env-file .env.compose.production build --no-cache fastapi
            docker compose --env-file .env.compose.production up -d
            echo "Waiting for services…"
            sleep 15
            curl -sf http://localhost:8000/health || echo "WARNING: Production health check failed"
          ENDSSH

      - name: Verify production
        run: |
          sleep 5
          curl -sf http://${{ secrets.DO_HOST }}:8000/health || exit 1
          echo "Production deploy successful"
