# ================================================================
# PR Check — Runs on every pull request
# ================================================================
# Verifies code quality before merge:
#   - Web: lint + TypeScript type-check + build
#   - Backend: Python lint (ruff)
#
# Does NOT deploy anything.
# ================================================================

name: PR Check

on:
  pull_request:
    branches: [integration, main]

jobs:
  # ── Web (Next.js) ──────────────────────────────────────────────
  web-check:
    name: Web — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript type-check & build
        run: npm run build

  # ── Backend (FastAPI) ──────────────────────────────────────────
  backend-check:
    name: Backend — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check .

      # Optional: uncomment when you have type stubs configured
      # - name: Type-check with mypy
      #   run: |
      #     pip install mypy
      #     mypy . --ignore-missing-imports
