# ================================================================
# CI — Runs on every push to any branch
# ================================================================
# Ensures code quality at every commit:
#   - Web: lint + TypeScript type-check + build
#   - Backend: lint (ruff) + syntax check + integration tests
#
# Integration tests require the following GitHub secrets:
#   SUPABASE_URL, SUPABASE_PUB_KEY, SUPABASE_SERVICE_KEY,
#   DATABASE_URL, GITEA_ADMIN_TOKEN, GITEA_WEBHOOK_SECRET,
#   TEST_USER_EMAIL, TEST_USER_PASSWORD, REDIS_URL
#
# Tests run against the staging backend (no local Docker needed).
# ================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [integration, main]

# Cancel in-progress runs for the same ref (saves CI minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── File Guard ─────────────────────────────────────────────────
  file-guard:
    name: File Guard — Block unwanted files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for banned file patterns
        run: |
          # Compare against the merge base (PR) or parent commit (push)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            # Handle initial push (no previous commit)
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "Initial push — skipping file guard"
              exit 0
            fi
          fi

          BANNED=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD | grep -E \
            '(^|\/)target\/|__pycache__\/|node_modules\/|\.next\/|vendor\/git\/|\.cursorrules$|\.superpowers\/|\.DS_Store$|package-lock\.json$|\.pyc$|test_files\/' \
            || true)

          if [ -n "$BANNED" ]; then
            echo "::error::The following files should not be committed:"
            echo "$BANNED"
            echo ""
            echo "Blocked patterns: target/, __pycache__/, node_modules/, .next/,"
            echo "vendor/git/, .cursorrules, .superpowers/, .DS_Store, package-lock.json,"
            echo ".pyc, test_files/"
            exit 1
          fi

          echo "✓ No banned files detected"

  # ── Web (Next.js) ──────────────────────────────────────────────
  web:
    name: Web — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript type-check & build
        env:
          API_URL: http://localhost:8000
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── Backend Lint ───────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint & Syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Syntax check all Python files
        run: |
          find . -name '*.py' -not -path './__pycache__/*' \
            -exec python -m py_compile {} +
          echo "All Python files compile OK"

  # ── Backend Integration Tests ──────────────────────────────────
  backend-tests:
    name: Backend — Integration Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    # Only run tests when secrets are available (skip on forks)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r tests/requirements.txt

      - name: Run integration tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUB_KEY: ${{ secrets.SUPABASE_PUB_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITEA_URL: ${{ secrets.GITEA_URL }}
          GITEA_ADMIN_TOKEN: ${{ secrets.GITEA_ADMIN_TOKEN }}
          GITEA_WEBHOOK_SECRET: ${{ secrets.GITEA_WEBHOOK_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          RATE_LIMIT_ENABLED: "false"
          BASE_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          python tests/run_all.py \
            --base-url "${BASE_URL:-http://localhost:8000}" \
            --log-failures
